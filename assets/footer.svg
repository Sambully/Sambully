<svg width="1200" height="120" viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#131a3d"/>
      <stop offset="100%" stop-color="#0a0e27"/>
    </linearGradient>
    <linearGradient id="glowf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#00f5ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="120" fill="url(#bgf)"/>
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#glowf)" stroke-width="2" opacity="0.7"/>
  <text x="600" y="68" font-family="'Courier New', monospace" font-size="22" fill="url(#glowf)" text-anchor="middle" letter-spacing="4" font-weight="700">
    BUILD &#8226; SHIP &#8226; REPEAT
  </text>
  <text x="600" y="95" font-family="'Courier New', monospace" font-size="13" fill="#5b6a9c" text-anchor="middle" letter-spacing="2">
    thanks for scrolling this far
  </text>
</svg>
