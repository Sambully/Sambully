<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1f2630" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="14" fill="url(#grid)" opacity="0.5"/>
  <rect x="1" y="1" width="1198" height="358" rx="13" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- window title bar -->
  <rect x="1" y="1" width="1198" height="46" rx="13" fill="#161b22"/>
  <rect x="1" y="34" width="1198" height="13" fill="#161b22"/>
  <circle cx="34" cy="24" r="7" fill="#ff5f56"/>
  <circle cx="58" cy="24" r="7" fill="#ffbd2e"/>
  <circle cx="82" cy="24" r="7" fill="#27c93f"/>
  <text x="600" y="29" font-family="'Cascadia Code','Courier New',monospace" font-size="13" fill="#8b949e" text-anchor="middle">samarth@github &#8212; zsh &#8212; 120x24</text>

  <!-- terminal body -->
  <g font-family="'Cascadia Code','Courier New',monospace" font-size="22">
    <text x="46" y="100" fill="#34d399">samarth@dev<tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$</tspan><tspan fill="#e6edf3"> whoami</tspan></text>

    <text x="46" y="150" font-size="46" font-weight="700" fill="url(#accent)" opacity="0">
      Samarth Pal
      <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.4s" fill="freeze"/>
    </text>

    <text x="46" y="210" fill="#34d399" opacity="0">
      samarth@dev<tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$</tspan><tspan fill="#e6edf3"> cat role.txt</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.3s" fill="freeze"/>
    </text>

    <text x="46" y="255" font-size="24" fill="#e6edf3" opacity="0">
      Full-Stack Engineer <tspan fill="#fbbf24">building products end-to-end</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="2s" dur="0.4s" fill="freeze"/>
    </text>

    <text x="46" y="305" fill="#34d399" opacity="0">
      samarth@dev<tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.3s" fill="freeze"/>
    </text>
    <rect x="196" y="288" width="13" height="24" fill="#e6edf3" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.3s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0;1" begin="3s" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
